# Category assignment for skills fetched by APM into apm_modules/.
#
# apm.yml decides WHICH upstream skills are fetched and pins them; this file
# decides WHERE each one is published, as {category}.{skill} in every tool
# directory. Skills are matched by the `name:` field of their SKILL.md
# frontmatter, not by directory name.
#
# Format per line: "<skill-name> <category>".

